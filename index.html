<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mail Dispatch Studio</title>
    <style>
        :root {
            --bg-color: #f5f5f7;
            --card-bg: rgba(255, 255, 255, 0.9);
            --card-border: rgba(0, 0, 0, 0.08);
            --text-main: #1d1d1f;
            --text-muted: #86868b;
            --accent-blue: #0071e3;
            --accent-hover: #0077ed;
            --border-subtle: #d2d2d7;
            --radius-sm: 10px;
            --radius-md: 18px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 30px 15px;
        }

        .studio-card {
            width: 100%;
            max-width: 640px;
            background: var(--card-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-radius: var(--radius-md);
            border: 1px solid var(--card-border);
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.06);
            padding: 36px 32px;
        }

        .header-tag {
            font-size: 11px;
            font-weight: 700;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.8px;
            margin-bottom: 6px;
        }

        h1 {
            font-size: 26px;
            font-weight: 600;
            letter-spacing: -0.5px;
            margin-bottom: 24px;
        }

        /* Tabs */
        .tab-container {
            display: flex;
            background: #e8e8ed;
            border-radius: var(--radius-sm);
            padding: 3px;
            margin-bottom: 20px;
        }

        .tab-button {
            flex: 1;
            padding: 9px 12px;
            font-size: 13px;
            font-weight: 500;
            border: none;
            background: transparent;
            border-radius: 7px;
            cursor: pointer;
            transition: all 0.2s ease;
            color: var(--text-muted);
        }

        .tab-button.active {
            background: #fff;
            color: var(--text-main);
            box-shadow: 0 1px 4px rgba(0, 0, 0, 0.1);
        }

        .form-group {
            margin-bottom: 16px;
        }

        label {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 13px;
            font-weight: 500;
            margin-bottom: 6px;
            color: #333336;
        }

        .toggle-link {
            color: var(--accent-blue);
            cursor: pointer;
            font-size: 12px;
            text-decoration: none;
            font-weight: 500;
        }

        .toggle-link:hover {
            text-decoration: underline;
        }

        input[type="text"],
        textarea,
        input[type="file"] {
            width: 100%;
            padding: 11px 14px;
            font-size: 14px;
            font-family: inherit;
            border: 1px solid var(--border-subtle);
            border-radius: var(--radius-sm);
            background: #fff;
            outline: none;
            transition: border 0.15s ease, box-shadow 0.15s ease;
        }

        input[type="text"]:focus,
        textarea:focus {
            border-color: var(--accent-blue);
            box-shadow: 0 0 0 3px rgba(0, 113, 227, 0.15);
        }

        textarea {
            resize: vertical;
            min-height: 120px;
            line-height: 1.5;
        }

        .hint {
            font-size: 12px;
            color: var(--text-muted);
            margin-top: 5px;
            line-height: 1.4;
        }

        .tag-chip {
            background: #eef2f8;
            color: var(--accent-blue);
            padding: 2px 6px;
            border-radius: 4px;
            font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
            font-size: 11px;
        }

        .file-dropzone {
            border: 2px dashed var(--border-subtle);
            border-radius: var(--radius-sm);
            padding: 20px 16px;
            text-align: center;
            background: #fafafc;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .file-dropzone:hover,
        .file-dropzone.dragover {
            border-color: var(--accent-blue);
            background: #f0f7ff;
        }

        .file-dropzone input {
            display: none;
        }

        .btn-submit {
            width: 100%;
            background: var(--accent-blue);
            color: #fff;
            padding: 13px 20px;
            font-size: 15px;
            font-weight: 600;
            border: none;
            border-radius: var(--radius-sm);
            cursor: pointer;
            margin-top: 10px;
            transition: background 0.2s ease, transform 0.05s ease;
        }

        .btn-submit:hover {
            background: var(--accent-hover);
        }

        .btn-submit:active {
            transform: scale(0.99);
        }

        .btn-submit:disabled {
            background: #b0b0b5;
            cursor: not-allowed;
            transform: none;
        }

        #statusBox {
            margin-top: 18px;
            padding: 16px;
            border-radius: var(--radius-sm);
            font-size: 13px;
            line-height: 1.5;
            display: none;
            word-break: break-word;
        }

        #statusBox.success {
            background: #eaf7ed;
            color: #1b5e20;
            border: 1px solid #c8e6c9;
        }

        #statusBox.warning {
            background: #fff8e1;
            color: #b78103;
            border: 1px solid #ffe082;
        }

        #statusBox.error {
            background: #fdf2f2;
            color: #b71c1c;
            border: 1px solid #f8bbd0;
        }

        .failure-list {
            margin-top: 10px;
            padding-left: 18px;
            font-size: 12px;
            max-height: 180px;
            overflow-y: auto;
        }

        .failure-list li {
            margin-bottom: 5px;
        }

        .hidden {
            display: none !important;
        }
    </style>
</head>

<body>

    <div class="studio-card">
        <div class="header-tag">Dispatch Studio</div>
        <h1>Compose Message</h1>

        <!-- Mode Switcher Tabs -->
        <div class="tab-container">
            <button type="button" class="tab-button active" id="tabDirect" onclick="setMode('direct')">Direct Mail</button>
            <button type="button" class="tab-button" id="tabBulk" onclick="setMode('bulk')">Bulk Spreadsheet</button>
        </div>

        <form id="mailForm" onsubmit="handleDispatch(event)">

            <!-- MODE 1: Direct Recipients -->
            <div id="directRecipientsGroup" class="form-group">
                <label>
                    <span>To</span>
                    <span class="toggle-link" onclick="toggleCcBcc()">+ CC / BCC</span>
                </label>
                <input type="text" id="toInput" placeholder="sarah@example.com, alex@example.com">
                <p class="hint">Comma-separated for multiple direct recipients.</p>
            </div>

            <!-- CC / BCC Hidden Fields -->
            <div id="ccBccGroup" class="hidden">
                <div class="form-group">
                    <label>CC (Carbon Copy)</label>
                    <input type="text" id="ccInput" placeholder="manager@example.com">
                </div>
                <div class="form-group">
                    <label>BCC (Blind Carbon Copy)</label>
                    <input type="text" id="bccInput" placeholder="archive@example.com">
                </div>
            </div>

            <!-- MODE 2: Bulk Spreadsheet Upload -->
            <div id="bulkSpreadsheetGroup" class="form-group hidden">
                <label>Upload Contacts (.csv or .xlsx)</label>
                <div class="file-dropzone" id="bulkDropzone" onclick="document.getElementById('recipientsFile').click()">
                    <span id="bulkFileLabel">📁 Click or drag .csv or .xlsx file here</span>
                    <input type="file" id="recipientsFile" accept=".csv, .xlsx, .xls" onchange="handleBulkFileSelected(this)">
                </div>
                <p class="hint">
                    Personalize dynamically using header tags like <span class="tag-chip">{name}</span> or <span class="tag-chip">{company}</span>.
                </p>
            </div>

            <!-- Subject Line -->
            <div class="form-group">
                <label>Subject</label>
                <input type="text" id="subjectInput" required placeholder="Important update for {name}">
            </div>

            <!-- Message Body -->
            <div class="form-group">
                <label>Message</label>
                <textarea id="messageInput" required placeholder="Hi {name},&#10;&#10;Here is your update regarding {company}..."></textarea>
            </div>

            <!-- General Attachment -->
            <div class="form-group">
                <label>Attachment (Optional)</label>
                <input type="file" id="generalAttachment">
                <p class="hint">Attach a PDF, image, or document (max 10 MB).</p>
            </div>

            <button type="submit" class="btn-submit" id="submitBtn">Dispatch Message</button>
        </form>

        <div id="statusBox"></div>
    </div>

    <script>
        let activeMode = "direct";

        function setMode(mode) {
            activeMode = mode;
            document.getElementById("tabDirect").classList.toggle("active", mode === "direct");
            document.getElementById("tabBulk").classList.toggle("active", mode === "bulk");
            document.getElementById("directRecipientsGroup").classList.toggle("hidden", mode === "bulk");
            document.getElementById("bulkSpreadsheetGroup").classList.toggle("hidden", mode === "direct");

            const toInput = document.getElementById("toInput");
            if (mode === "bulk") {
                toInput.removeAttribute("required");
            }
        }

        function toggleCcBcc() {
            const ccBcc = document.getElementById("ccBccGroup");
            ccBcc.classList.toggle("hidden");
        }

        function handleBulkFileSelected(input) {
            const label = document.getElementById("bulkFileLabel");
            if (input.files && input.files[0]) {
                label.innerText = `📄 Selected: ${input.files[0].name}`;
            } else {
                label.innerText = "📁 Click or drag .csv or .xlsx file here";
            }
        }

        // Drag and Drop support
        const dropzone = document.getElementById("bulkDropzone");
        ['dragenter', 'dragover'].forEach(name => {
            dropzone.addEventListener(name, (e) => {
                e.preventDefault();
                dropzone.classList.add('dragover');
            });
        });
        ['dragleave', 'drop'].forEach(name => {
            dropzone.addEventListener(name, (e) => {
                e.preventDefault();
                dropzone.classList.remove('dragover');
            });
        });
        dropzone.addEventListener('drop', (e) => {
            if (e.dataTransfer.files && e.dataTransfer.files[0]) {
                const fileInput = document.getElementById("recipientsFile");
                fileInput.files = e.dataTransfer.files;
                handleBulkFileSelected(fileInput);
            }
        });

        function escapeHtml(str) {
            if (!str) return '';
            const div = document.createElement('div');
            div.textContent = str;
            return div.innerHTML;
        }

        function showStatus(type, htmlContent) {
            const statusBox = document.getElementById("statusBox");
            statusBox.className = type;
            statusBox.innerHTML = htmlContent;
            statusBox.style.display = "block";
        }

        async function handleDispatch(e) {
            e.preventDefault();
            const submitBtn = document.getElementById("submitBtn");
            const statusBox = document.getElementById("statusBox");

            submitBtn.disabled = true;
            submitBtn.innerText = "Dispatching...";
            statusBox.style.display = "none";
            statusBox.className = "";
            statusBox.innerHTML = "";

            const formData = new FormData();
            formData.append("subject", document.getElementById("subjectInput").value);
            formData.append("message", document.getElementById("messageInput").value);

            const cc = document.getElementById("ccInput").value;
            const bcc = document.getElementById("bccInput").value;
            if (cc.trim()) formData.append("cc", cc.trim());
            if (bcc.trim()) formData.append("bcc", bcc.trim());

            const fileInput = document.getElementById("generalAttachment");
            if (fileInput.files[0]) {
                formData.append("file", fileInput.files[0]);
            }

            if (activeMode === "direct") {
                const to = document.getElementById("toInput").value;
                if (!to.trim()) {
                    alert("Please enter at least one recipient email address.");
                    submitBtn.disabled = false;
                    submitBtn.innerText = "Dispatch Message";
                    return;
                }
                formData.append("to", to.trim());
            } else {
                const bulkFile = document.getElementById("recipientsFile").files[0];
                if (!bulkFile) {
                    alert("Please select or upload a .csv or .xlsx spreadsheet.");
                    submitBtn.disabled = false;
                    submitBtn.innerText = "Dispatch Message";
                    return;
                }
                formData.append("recipients_file", bulkFile);
            }

            try {
                const res = await fetch("/send-mail", {
                    method: "POST",
                    body: formData
                });

                // Safe parsing: avoid JSON parse errors on plain-text server errors
                let data = null;
                let rawText = "";
                const contentType = res.headers.get("content-type") || "";

                if (contentType.includes("application/json")) {
                    try {
                        data = await res.json();
                    } catch (err) {
                        rawText = await res.text();
                    }
                } else {
                    rawText = await res.text();
                }

                // Handle HTTP errors (4xx, 5xx)
                if (!res.ok) {
                    const errorDetail = data?.detail || rawText || `Server returned error code ${res.status}`;
                    showStatus("error", `<strong>Dispatch Rejected (HTTP ${res.status}):</strong><br>${escapeHtml(errorDetail)}`);
                    return;
                }

                // Handle Successful HTTP response
                if (data && data.mode === "bulk_personalization" && data.details) {
                    const { total, successful, failed, failure_details } = data.details;

                    if (failed > 0) {
                        let failureHtml = `<strong>Bulk Dispatch Summary:</strong> Delivered ${successful} of ${total} personalized emails.<br>`;
                        failureHtml += `<div style="margin-top: 6px; font-weight: 600;">Rejection Reasons:</div>`;
                        failureHtml += `<ul class="failure-list">`;
                        
                        failure_details.forEach(item => {
                            failureHtml += `<li><strong>${escapeHtml(item.email)}:</strong> ${escapeHtml(item.error)}</li>`;
                        });
                        
                        failureHtml += `</ul>`;
                        showStatus(successful > 0 ? "warning" : "error", failureHtml);
                    } else {
                        showStatus("success", `<strong>Success!</strong><br>All ${successful} personalized emails were dispatched successfully.`);
                    }
                } else {
                    showStatus("success", `<strong>Success!</strong><br>${escapeHtml(data?.message || "Message dispatched successfully.")}`);
                }

            } catch (err) {
                showStatus("error", `<strong>Network/Client Error:</strong><br>${escapeHtml(err.message)}`);
            } finally {
                submitBtn.disabled = false;
                submitBtn.innerText = "Dispatch Message";
            }
        }
    </script>
</body>

</html>
