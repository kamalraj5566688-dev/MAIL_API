<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mail Dispatch Studio</title>
    <style>
        :root {
            --bg-color: #f5f5f7;
            --card-bg: rgba(255, 255, 255, 0.85);
            --card-border: rgba(0, 0, 0, 0.08);
            --text-main: #1d1d1f;
            --text-muted: #86868b;
            --accent-blue: #0071e3;
            --accent-hover: #0077ed;
            --border-subtle: #d2d2d7;
            --radius-sm: 10px;
            --radius-md: 18px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 30px 15px;
        }

        .studio-card {
            width: 100%;
            max-width: 640px;
            background: var(--card-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-radius: var(--radius-md);
            border: 1px solid var(--card-border);
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.06);
            padding: 36px 32px;
        }

        .header-tag {
            font-size: 11px;
            font-weight: 700;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.8px;
            margin-bottom: 6px;
        }

        h1 {
            font-size: 26px;
            font-weight: 600;
            letter-spacing: -0.5px;
            margin-bottom: 24px;
        }

        /* Tabs */
        .tab-container {
            display: flex;
            background: #e8e8ed;
            border-radius: var(--radius-sm);
            padding: 3px;
            margin-bottom: 20px;
        }

        .tab-button {
            flex: 1;
            padding: 8px 12px;
            font-size: 13px;
            font-weight: 500;
            border: none;
            background: transparent;
            border-radius: 7px;
            cursor: pointer;
            transition: all 0.2s ease;
            color: var(--text-muted);
        }

        .tab-button.active {
            background: #fff;
            color: var(--text-main);
            box-shadow: 0 1px 4px rgba(0, 0, 0, 0.1);
        }

        .form-group {
            margin-bottom: 16px;
        }

        label {
            display: flex;
            justify-content: space-between;
            font-size: 13px;
            font-weight: 500;
            margin-bottom: 6px;
            color: #333336;
        }

        .toggle-link {
            color: var(--accent-blue);
            cursor: pointer;
            font-size: 12px;
            text-decoration: none;
        }

        input[type="text"],
        textarea,
        input[type="file"] {
            width: 100%;
            padding: 11px 14px;
            font-size: 14px;
            font-family: inherit;
            border: 1px solid var(--border-subtle);
            border-radius: var(--radius-sm);
            background: #fff;
            outline: none;
            transition: border 0.15s ease, box-shadow 0.15s ease;
        }

        input[type="text"]:focus,
        textarea:focus {
            border-color: var(--accent-blue);
            box-shadow: 0 0 0 3px rgba(0, 113, 227, 0.15);
        }

        textarea {
            resize: vertical;
            min-height: 120px;
        }

        .hint {
            font-size: 12px;
            color: var(--text-muted);
            margin-top: 4px;
            line-height: 1.4;
        }

        .tag-chip {
            background: #eef2f8;
            color: var(--accent-blue);
            padding: 1px 6px;
            border-radius: 4px;
            font-family: monospace;
            font-size: 11px;
        }

        .file-dropzone {
            border: 2px dashed var(--border-subtle);
            border-radius: var(--radius-sm);
            padding: 16px;
            text-align: center;
            background: #fafafc;
            cursor: pointer;
        }

        .file-dropzone input {
            display: none;
        }

        .btn-submit {
            width: 100%;
            background: var(--accent-blue);
            color: #fff;
            padding: 13px 20px;
            font-size: 15px;
            font-weight: 600;
            border: none;
            border-radius: var(--radius-sm);
            cursor: pointer;
            margin-top: 10px;
            transition: background 0.2s ease;
        }

        .btn-submit:hover {
            background: var(--accent-hover);
        }

        .btn-submit:disabled {
            background: #b0b0b5;
            cursor: not-allowed;
        }

        #statusBox {
            margin-top: 18px;
            padding: 14px;
            border-radius: var(--radius-sm);
            font-size: 13px;
            line-height: 1.4;
            display: none;
        }

        #statusBox.success {
            background: #e8f5e9;
            color: #1b5e20;
            border: 1px solid #c8e6c9;
        }

        #statusBox.error {
            background: #ffebee;
            color: #b71c1c;
            border: 1px solid #ffcdd2;
        }

        .hidden {
            display: none;
        }
    </style>
</head>

<body>

    <div class="studio-card">
        <div class="header-tag">Dispatch Studio</div>
        <h1>Compose Message</h1>

        <!-- Mode Switcher Tabs -->
        <div class="tab-container">
            <button type="button" class="tab-button active" id="tabDirect" onclick="setMode('direct')">Direct
                Mail</button>
            <button type="button" class="tab-button" id="tabBulk" onclick="setMode('bulk')">Bulk Spreadsheet</button>
        </div>

        <form id="mailForm" onsubmit="handleDispatch(event)">

            <!-- MODE 1: Direct Recipients -->
            <div id="directRecipientsGroup" class="form-group">
                <label>
                    <span>To</span>
                    <span class="toggle-link" onclick="toggleCcBcc()">+ CC / BCC</span>
                </label>
                <input type="text" id="toInput" placeholder="sarah@example.com, alex@example.com" />
                <p class="hint">Comma-separated for multiple direct recipients.</p>
            </div>

            <!-- CC / BCC Hidden Fields -->
            <div id="ccBccGroup" class="hidden">
                <div class="form-group">
                    <label>CC (Carbon Copy)</label>
                    <input type="text" id="ccInput" placeholder="manager@example.com" />
                </div>
                <div class="form-group">
                    <label>BCC (Blind Carbon Copy)</label>
                    <input type="text" id="bccInput" placeholder="archive@example.com" />
                </div>
            </div>

            <!-- MODE 2: Bulk Spreadsheet Upload -->
            <div id="bulkSpreadsheetGroup" class="form-group hidden">
                <label>Upload Contacts (.csv or .xlsx)</label>
                <div class="file-dropzone" onclick="document.getElementById('recipientsFile').click()">
                    <span id="bulkFileLabel">📁 Click to select .csv or .xlsx file</span>
                    <input type="file" id="recipientsFile" accept=".csv, .xlsx, .xls"
                        onchange="handleBulkFileSelected(this)" />
                </div>
                <p class="hint">
                    Personalize using column tags like <span class="tag-chip">{name}</span> or <span
                        class="tag-chip">{company}</span> in your message.
                </p>
            </div>

            <!-- Subject Line -->
            <div class="form-group">
                <label>Subject</label>
                <input type="text" id="subjectInput" required placeholder="Important project update for {name}" />
            </div>

            <!-- Message Body -->
            <div class="form-group">
                <label>Message</label>
                <textarea id="messageInput" required
                    placeholder="Hi {name},\n\nHere is your custom dispatch regarding {company}..."></textarea>
            </div>

            <!-- General Attachment -->
            <div class="form-group">
                <label>Attachment (Optional)</label>
                <input type="file" id="generalAttachment" />
                <p class="hint">Attach a PDF, image, or document (under 10 MB).</p>
            </div>

            <button type="submit" class="btn-submit" id="submitBtn">Dispatch Message</button>
        </form>

        <div id="statusBox"></div>
    </div>

    <script>
        let activeMode = "direct";

        function setMode(mode) {
            activeMode = mode;
            document.getElementById("tabDirect").classList.toggle("active", mode === "direct");
            document.getElementById("tabBulk").classList.toggle("active", mode === "bulk");
            document.getElementById("directRecipientsGroup").classList.toggle("hidden", mode === "bulk");
            document.getElementById("bulkSpreadsheetGroup").classList.toggle("hidden", mode === "direct");

            const toInput = document.getElementById("toInput");
            if (mode === "bulk") {
                toInput.removeAttribute("required");
            }
        }

        function toggleCcBcc() {
            const ccBcc = document.getElementById("ccBccGroup");
            ccBcc.classList.toggle("hidden");
        }

        function handleBulkFileSelected(input) {
            const label = document.getElementById("bulkFileLabel");
            if (input.files && input.files[0]) {
                label.innerText = `📄 Selected: ${input.files[0].name}`;
            } else {
                label.innerText = "📁 Click to select .csv or .xlsx file";
            }
        }

        async function handleDispatch(e) {
            e.preventDefault();
            const submitBtn = document.getElementById("submitBtn");
            const statusBox = document.getElementById("statusBox");

            submitBtn.disabled = true;
            submitBtn.innerText = "Dispatching...";
            statusBox.style.display = "none";
            statusBox.className = "";

            const formData = new FormData();
            formData.append("subject", document.getElementById("subjectInput").value);
            formData.append("message", document.getElementById("messageInput").value);

            const cc = document.getElementById("ccInput").value;
            const bcc = document.getElementById("bccInput").value;
            if (cc) formData.append("cc", cc);
            if (bcc) formData.append("bcc", bcc);

            const fileInput = document.getElementById("generalAttachment");
            if (fileInput.files[0]) {
                formData.append("file", fileInput.files[0]);
            }

            if (activeMode === "direct") {
                const to = document.getElementById("toInput").value;
                if (!to.trim()) {
                    alert("Please enter at least one recipient.");
                    submitBtn.disabled = false;
                    submitBtn.innerText = "Dispatch Message";
                    return;
                }
                formData.append("to", to);
            } else {
                const bulkFile = document.getElementById("recipientsFile").files[0];
                if (!bulkFile) {
                    alert("Please upload a .csv or .xlsx spreadsheet.");
                    submitBtn.disabled = false;
                    submitBtn.innerText = "Dispatch Message";
                    return;
                }
                formData.append("recipients_file", bulkFile);
            }

            try {
                const res = await fetch("/send-mail", {
                    method: "POST",
                    body: formData
                });
                const data = await res.json();

                if (res.ok) {
                    statusBox.className = "success";
                    statusBox.innerText = data.message || "Dispatched successfully!";
                    statusBox.style.display = "block";
                } else {
                    statusBox.className = "error";
                    statusBox.innerText = data.detail || "Dispatch failed. Check server logs.";
                    statusBox.style.display = "block";
                }
            } catch (err) {
                statusBox.className = "error";
                statusBox.innerText = `Network error: ${err.message}`;
                statusBox.style.display = "block";
            } finally {
                submitBtn.disabled = false;
                submitBtn.innerText = "Dispatch Message";
            }
        }
    </script>
</body>

</html>
