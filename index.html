<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mail Dispatch Studio</title>
    <link rel="icon"
        href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='50' cy='50' r='50' fill='%230066cc'/></svg>">
    <style>
        :root {
            --primary: #0066cc;
            --primary-focus: #0071e3;
            --ink: #1d1d1f;
            --ink-muted: #86868b;
            --canvas: #ffffff;
            --canvas-parchment: #f5f5f7;
            --surface-pearl: #fafafc;
            --hairline: rgba(0, 0, 0, 0.08);
            --radius-card: 20px;
            --radius-pill: 9999px;
            --radius-input: 12px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-font-smoothing: antialiased;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, sans-serif;
            background-color: var(--canvas-parchment);
            color: var(--ink);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            letter-spacing: -0.374px;
            overflow-x: hidden;
        }

        /* Kinetic Shimmer Preloader */
        .preloader {
            position: fixed;
            inset: 0;
            background-color: #000000;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 99999;
            transition: opacity 0.7s cubic-bezier(0.16, 1, 0.3, 1), visibility 0.7s;
        }

        .preloader.fade-out {
            opacity: 0;
            visibility: hidden;
        }

        .preloader-inner {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 18px;
            text-align: center;
            padding: 0 20px;
        }

        /* Preloader Logo Avatar */
        .preloader-logo {
            width: 86px;
            height: 86px;
            border-radius: 50%;
            animation: logoEntrance 1s cubic-bezier(0.16, 1, 0.3, 1) forwards,
                logoPulse 2.4s ease-in-out infinite 1s;
            filter: drop-shadow(0 0 16px rgba(0, 102, 204, 0.35));
        }

        @keyframes logoEntrance {
            0% {
                opacity: 0;
                transform: scale(0.65) translateY(14px);
            }

            100% {
                opacity: 1;
                transform: scale(1) translateY(0);
            }
        }

        @keyframes logoPulse {

            0%,
            100% {
                transform: scale(1);
                filter: drop-shadow(0 0 14px rgba(0, 102, 204, 0.3));
            }

            50% {
                transform: scale(1.03);
                filter: drop-shadow(0 0 24px rgba(0, 113, 227, 0.65));
            }
        }

        .creator-tag {
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", system-ui, sans-serif;
            font-size: clamp(20px, 3.5vw, 30px);
            font-weight: 500;
            letter-spacing: -0.5px;
            background: linear-gradient(90deg,
                    rgba(255, 255, 255, 0.2) 0%,
                    rgba(255, 255, 255, 1) 50%,
                    rgba(255, 255, 255, 0.2) 100%);
            background-size: 200% 100%;
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: textShimmer 2.2s infinite ease-in-out;
        }

        .preloader-track {
            width: 140px;
            height: 2px;
            background: rgba(255, 255, 255, 0.12);
            border-radius: 9999px;
            overflow: hidden;
            position: relative;
        }

        .preloader-bar {
            position: absolute;
            top: 0;
            left: 0;
            height: 100%;
            width: 0%;
            background: #ffffff;
            border-radius: 9999px;
            animation: loadProgress 1.6s cubic-bezier(0.65, 0, 0.35, 1) forwards;
        }

        @keyframes textShimmer {
            0% {
                background-position: 200% 0;
            }

            100% {
                background-position: -200% 0;
            }
        }

        @keyframes loadProgress {
            0% {
                width: 0%;
            }

            60% {
                width: 70%;
            }

            100% {
                width: 100%;
            }
        }

        /* Nav Bar with Top-Stacked Logo */
        .nav-bar {
            min-height: 64px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 8px max(24px, calc((100% - 980px) / 2));
            background: rgba(245, 245, 247, 0.85);
            backdrop-filter: saturate(180%) blur(20px);
            -webkit-backdrop-filter: saturate(180%) blur(20px);
            border-bottom: 1px solid var(--hairline);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .nav-label {
            font-size: 13px;
            font-weight: 600;
            letter-spacing: 0.2px;
            color: var(--ink);
            text-transform: uppercase;
        }

        .nav-profile-stack {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 3px;
        }

        .nav-logo {
            width: 30px;
            height: 30px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 0 0 1px rgba(0, 102, 204, 0.25), 0 2px 6px rgba(0, 0, 0, 0.08);
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        .nav-logo:hover {
            transform: scale(1.08);
            box-shadow: 0 0 0 2px rgba(0, 113, 227, 0.4), 0 4px 10px rgba(0, 102, 204, 0.2);
        }

        .nav-status {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            font-size: 11px;
            font-weight: 500;
            color: var(--ink-muted);
            letter-spacing: -0.1px;
        }

        .status-dot {
            width: 6px;
            height: 6px;
            background-color: #34c759;
            border-radius: 50%;
            box-shadow: 0 0 0 2px rgba(52, 199, 89, 0.2);
        }

        /* Canvas Frame */
        .content-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 40px 20px 64px;
        }

        .hero-heading {
            text-align: center;
            margin-bottom: 30px;
        }

        .hero-heading h1 {
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", system-ui, sans-serif;
            font-size: clamp(32px, 4vw, 44px);
            font-weight: 600;
            line-height: 1.1;
            letter-spacing: -0.5px;
            margin-bottom: 8px;
        }

        .hero-heading p {
            color: var(--ink-muted);
            font-size: 17px;
        }

        /* Dispatch Card */
        .mail-sheet {
            background: var(--canvas);
            width: 100%;
            max-width: 520px;
            border-radius: var(--radius-card);
            border: 1px solid var(--hairline);
            box-shadow: 0 16px 36px rgba(0, 0, 0, 0.03);
            padding: 32px;
        }

        .input-group {
            margin-bottom: 20px;
        }

        .input-group label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            margin-bottom: 8px;
            color: var(--ink);
            letter-spacing: -0.2px;
        }

        .input-group input[type="text"],
        .input-group textarea {
            width: 100%;
            padding: 13px 16px;
            background-color: var(--surface-pearl);
            border: 1px solid var(--hairline);
            border-radius: var(--radius-input);
            font-size: 16px;
            font-family: inherit;
            color: var(--ink);
            outline: none;
            transition: all 0.2s ease;
        }

        .input-group input:focus,
        .input-group textarea:focus {
            background-color: var(--canvas);
            border-color: var(--primary-focus);
            box-shadow: 0 0 0 3px rgba(0, 113, 227, 0.15);
        }

        .input-group textarea {
            resize: vertical;
            min-height: 120px;
            line-height: 1.5;
        }

        /* Minimal Upload Area */
        .upload-tray {
            position: relative;
            border: 1px dashed #d2d2d7;
            border-radius: var(--radius-input);
            background: var(--surface-pearl);
            padding: 20px;
            text-align: center;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .upload-tray:hover {
            border-color: var(--primary);
            background: var(--canvas);
        }

        .upload-tray input[type="file"] {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            opacity: 0;
            cursor: pointer;
        }

        .upload-text {
            font-size: 13px;
            color: var(--ink-muted);
            pointer-events: none;
        }

        .upload-text strong {
            color: var(--primary);
            font-weight: 500;
        }

        .file-chosen-banner {
            display: none;
            font-size: 13px;
            font-weight: 500;
            color: var(--ink);
            word-break: break-all;
            pointer-events: none;
        }

        /* Pill Trigger CTA */
        .btn-dispatch {
            background-color: var(--primary);
            color: #ffffff;
            border: none;
            border-radius: var(--radius-pill);
            padding: 13px 24px;
            font-size: 16px;
            font-family: inherit;
            width: 100%;
            cursor: pointer;
            margin-top: 8px;
            transition: transform 0.1s ease, background-color 0.2s ease;
        }

        .btn-dispatch:hover {
            background-color: var(--primary-focus);
        }

        .btn-dispatch:active {
            transform: scale(0.97);
        }

        .btn-dispatch:disabled {
            background-color: #d2d2d7;
            cursor: not-allowed;
            transform: none;
        }

        /* Inline Feedback Banner */
        .status-banner {
            display: none;
            margin-top: 18px;
            padding: 12px 16px;
            border-radius: var(--radius-input);
            font-size: 13px;
            text-align: center;
        }

        .status-banner.success {
            background: #e8f5e9;
            color: #1b5e20;
        }

        .status-banner.error {
            background: #ffebee;
            color: #c62828;
        }

        /* Footnote */
        footer {
            border-top: 1px solid var(--hairline);
            padding: 24px;
            text-align: center;
            font-size: 12px;
            color: var(--ink-muted);
        }
    </style>
</head>

    </div>

    <!-- Minimal Header with Logo Stacked Above "API Online" -->

        <span class="nav-label">Mail Dispatch</span>
        <div class="nav-profile-stack">
            <!-- Nav Avatar Logo positioned directly above the status line -->
            <div class="nav-logo" id="navLogo">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="100%" height="100%">
                    <defs>
                        <linearGradient id="bgGradNav" x1="0%" y1="0%" x2="100%" y2="100%">
                            <stop offset="0%" stop-color="#1d1d1f" />
                            <stop offset="100%" stop-color="#0a0a0c" />
                        </linearGradient>
                        <radialGradient id="ringGlowNav" cx="50%" cy="50%" r="50%">
                            <stop offset="85%" stop-color="#0066cc" stop-opacity="0" />
                            <stop offset="100%" stop-color="#0066cc" stop-opacity="0.85" />

    <!-- Dispatch Surface -->
    <main class="content-container">
        <div class="hero-heading">
            <h1>Send Direct.</h1>
            <p>Composed with intention. Delivered with speed.</p>
        </div>

        <div class="mail-sheet">
            <form id="mailForm">
                <div class="input-group">
                    <label for="to">Recipients (comma-separated)</label>
                    <input type="text" id="to" name="to" required
                        placeholder="alex@domain.com, sara@domain.com, team@company.com">
                </div>

                <div class="input-group">
                    <label for="subject">Subject</label>
                    <input type="text" id="subject" name="subject" required placeholder="Subject context">
                </div>

                <div class="input-group">
                    <label for="message">Message</label>
                    <textarea id="message" name="message" required placeholder="Write your thoughts..."></textarea>
                </div>

                <div class="input-group">
                    <label>Attachment</label>
                    <div class="upload-tray" id="dropzone">
                        <input type="file" id="file" name="file">
                        <div class="upload-text" id="uploadPrompt">
                            Drop an asset or <strong>browse files</strong>
                        </div>
                        <div class="file-chosen-banner" id="fileNameLabel"></div>
                    </div>
                </div>

                <button type="submit" class="btn-dispatch" id="submitBtn">Send Message</button>
            </form>

            <div id="statusBanner" class="status-banner"></div>
        </div>
    </main>

    <footer>
        Precision Mail Engine &bull; Kamal Raj Edition
    </footer>

    <script>
        // Dismiss preloader smoothly
        window.addEventListener('load', () => {
            const preloader = document.getElementById('preloader');
            setTimeout(() => {
                preloader.classList.add('fade-out');
            }, 1800);
        });

        const form = document.getElementById('mailForm');
        const submitBtn = document.getElementById('submitBtn');
        const statusBanner = document.getElementById('statusBanner');
        const fileInput = document.getElementById('file');
        const dropzone = document.getElementById('dropzone');
        const uploadPrompt = document.getElementById('uploadPrompt');
        const fileNameLabel = document.getElementById('fileNameLabel');

        function updateAttachment() {
            if (fileInput.files && fileInput.files.length > 0) {
                uploadPrompt.style.display = 'none';
                fileNameLabel.style.display = 'block';
                fileNameLabel.textContent = 'Attached: ' + fileInput.files[0].name;
            } else {
                uploadPrompt.style.display = 'block';
                fileNameLabel.style.display = 'none';
                fileNameLabel.textContent = '';
            }
        }

        fileInput.addEventListener('change', updateAttachment);

        ['dragenter', 'dragover'].forEach(evt => {
            dropzone.addEventListener(evt, (e) => {
                e.preventDefault();
                dropzone.style.borderColor = 'var(--primary)';
                dropzone.style.background = 'var(--canvas)';
            });
        });

        ['dragleave', 'drop'].forEach(evt => {
            dropzone.addEventListener(evt, (e) => {
                e.preventDefault();
                dropzone.style.borderColor = '#d2d2d7';
                dropzone.style.background = 'var(--surface-pearl)';
            });
        });

        dropzone.addEventListener('drop', (e) => {
            if (e.dataTransfer.files && e.dataTransfer.files.length > 0) {
                fileInput.files = e.dataTransfer.files;
                updateAttachment();
            }
        });

        form.addEventListener('submit', async (e) => {
            e.preventDefault();

            submitBtn.disabled = true;
            submitBtn.textContent = 'Sending...';
            statusBanner.style.display = 'none';
            statusBanner.className = 'status-banner';

            try {
                const formData = new FormData(form);
                const res = await fetch('/send-mail', {
                    method: 'POST',
                    body: formData
                });

                const result = await res.json();

                if (res.ok) {
                    statusBanner.textContent = result.message || 'Email dispatched successfully!';
                    statusBanner.classList.add('success');
                    form.reset();
                    updateAttachment();
                } else {
                    throw new Error(result.detail || 'Dispatch failed.');
                }
            } catch (err) {
                statusBanner.textContent = err.message || 'An unexpected dispatch error occurred.';
                statusBanner.classList.add('error');
            } finally {
                statusBanner.style.display = 'block';
                submitBtn.disabled = false;
                submitBtn.textContent = 'Send Message';
            }
        });
    </script>
</body>

</html>
